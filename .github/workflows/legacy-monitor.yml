name: PhoenX legacy site monitor

on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
  push:
    branches: [feat/github-pages-flexibility-test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-public-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalogue source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test archive checksum verifier
        run: node --test tests/archive-manifest.test.mjs
      - name: Check media metadata audit report
        run: node scripts/audit-media-inventory.mjs --check
      - name: Rebuild imported archive and validate internal links
        run: |
          node scripts/build.mjs
          node scripts/check-build.mjs
      - name: Verify generated output is reproducible and branding guard passes
        run: |
          git diff --exit-code
          python scripts/check_banned_terms.py
      - name: Check live homepage, release pages, and imported archive
        run: node scripts/check-live-site.mjs
