name: Build and publish PhoenX site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # The generated-file commit itself is published by GitHub Pages; skip it to prevent a loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python for the banned-term guard
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build static site (Node.js built-ins only)
        run: node scripts/build.mjs
      - name: Verify generated site
        run: node scripts/check-build.mjs
      - name: Stage generated site and run identity check
        run: |
          git add index.html .nojekyll releases/ about/ videos/
          python scripts/check_banned_terms.py
          git diff --cached --check
      - name: Commit generated site when it changed
        run: |
          if git diff --cached --quiet; then
            echo "Generated site is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[phoenxmusic.github.io] Build static site"
          git push origin HEAD:main
