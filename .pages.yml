media: media

content:
  - name: releases
    label: Releases
    type: collection
    path: content/releases
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: false
    view:
      primary: title
      fields: [title, year, type, language]
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: year
        label: Year
        type: string
      - name: type
        label: Type
        type: string
      - name: language
        label: Language
        type: string
      - name: youtube_id
        label: YouTube video ID
        type: string
        description: Leave blank unless the video is verified for this release.
        pattern:
          regex: "^$|^[A-Za-z0-9_-]{11}$"
          message: "Enter an 11-character YouTube ID or leave blank."
      - name: artwork
        label: Artwork
        type: image
        options:
          path: artwork
          extensions: [jpg, jpeg, png, webp, avif]
      - name: old_site_url
        label: Original release URL
        type: string
      - name: body
        label: Story and credits
        type: rich-text

  - name: site
    label: Homepage settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: title
        label: Site title
        type: string
        required: true
      - name: tagline
        label: Homepage subtitle
        type: string
        required: true
      - name: description
        label: Search and sharing description
        type: text
      - name: original_site_url
        label: Original WordPress site URL
        type: string
      - name: featured_video_id
        label: Featured YouTube video ID
        type: string
        description: Use only a verified video ID; leave blank to hide the featured player.
        pattern:
          regex: "^$|^[A-Za-z0-9_-]{11}$"
          message: "Enter an 11-character YouTube ID or leave blank."

settings:
  content:
    merge: true
